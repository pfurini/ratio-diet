# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en
early_access: false
inheritance: false
knowledge_base:
  learnings:
    scope: local
  pull_requests:
    scope: local
  issues:
    scope: local
reviews:
  high_level_summary: true
  sequence_diagrams: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  path_filters:
    - "apps/**"
    - "packages/**"
    - "CLAUDE.md"
    - "README.md"
    - "AGENTS.md"
    - "package.json"
    - "turbo.json"
    - "tsconfig.json"
    - ".oxlintrc.json"
    - ".oxfmtrc.jsonc"
    - "!**/.temp/**" # Exclude temporary files
    - "!**/supabase/migrations/**" # Exclude migrations
    - "!**/turbo/**" # Exclude turbo
    - "!**/.turbo/**" # Exclude turbo cache
    - "!**/playwright-report/**" # Exclude playwright report
    - "!**/test-results/**" # Exclude test results
    - "!packages/ui/src/components/**" # Exclude shadcn ui components
chat:
  auto_reply: true
issue_enrichment:
  auto_enrich:
    enabled: true
